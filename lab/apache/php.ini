; PHP2Shell lab — Apache mod_php (Chain D / OOM target)
; PHP 8.2.34 = last vulnerable 8.2.x (fixed in 8.2.35)
session.upload_progress.enabled = On
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 1
session.use_only_cookies = On
; Low limit so the OOM probe can trip it inside the lab
memory_limit = 32M
display_errors = On
error_reporting = E_ALL
