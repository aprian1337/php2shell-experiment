services:
  apache-modphp:
    image: php:8.2.34-apache
    container_name: php2shell-apache
    ports:
      - "18080:80"
    volumes:
      - ./www:/var/www/html
      - ./apache/php.ini:/usr/local/etc/php/conf.d/zz-lab.ini

  fpm:
    image: php:8.2.34-fpm
    container_name: php2shell-fpm
    volumes:
      - ./www:/var/www/html
      - ./fpm/php.ini:/usr/local/etc/php/conf.d/zz-lab.ini
      - ./fpm/zz-pm.conf:/usr/local/etc/php-fpm.d/zz-pm.conf

  nginx:
    image: nginx:1.27-alpine
    container_name: php2shell-nginx
    ports:
      - "18081:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./fpm/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm

  # PHP 8.2.34 compiled from source with AddressSanitizer. `check.py uaf`
  # arms the stall-window sequence here and reads the sanitizer report back.
  asan:
    build:
      context: ./asan
    container_name: php2shell-asan
    ports:
      - "18082:18082"
    volumes:
      - ./www:/var/www/html
